name: Update LeetCode Progress

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-progress:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update README progress
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import os
          import re
          import urllib.request
          import json
          import subprocess

          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GITHUB_TOKEN"]
          api = f"https://api.github.com/repos/{repo}/git/trees/{os.environ['GITHUB_SHA']}?recursive=1"

          req = urllib.request.Request(
              api,
              headers={
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/vnd.github+json",
                  "User-Agent": "leetcode-progress-updater",
              },
          )
          with urllib.request.urlopen(req) as response:
              tree = json.load(response)["tree"]

          # Every LeetSync problem folder contains a README.md with a
          # LeetCode difficulty badge. Count those problem READMEs.
          problem_readmes = [
              item["path"]
              for item in tree
              if item.get("type") == "blob"
              and re.fullmatch(r"\d+[^/]*/README\.md", item["path"])
          ]

          counts = {"Easy": 0, "Medium": 0, "Hard": 0}
          for path in problem_readmes:
              raw_url = f"https://raw.githubusercontent.com/{repo}/{os.environ['GITHUB_SHA']}/{urllib.parse.quote(path)}"
              req = urllib.request.Request(raw_url, headers={"User-Agent": "leetcode-progress-updater"})
              try:
                  with urllib.request.urlopen(req) as response:
                      text = response.read().decode("utf-8", errors="ignore")
                  match = re.search(r"Difficulty-([A-Za-z]+)-", text, re.IGNORECASE)
                  if match:
                      difficulty = match.group(1).capitalize()
                      if difficulty in counts:
                          counts[difficulty] += 1
              except Exception as exc:
                  print(f"Skipping {path}: {exc}")

          total = sum(counts.values())
          readme_path = "README.md"
          with open(readme_path, "r", encoding="utf-8") as f:
              readme = f.read()

          start = "<!-- LEETCODE_PROGRESS_START -->"
          end = "<!-- LEETCODE_PROGRESS_END -->"
          new_block = f"""{start}\n\n| Difficulty | Solved |\n|---|---:|\n| 🟢 Easy | {counts['Easy']} |\n| 🟡 Medium | {counts['Medium']} |\n| 🔴 Hard | {counts['Hard']} |\n| **Total** | **{total}** |\n\n{end}"""

          if start in readme and end in readme:
              readme = re.sub(
                  re.escape(start) + r".*?" + re.escape(end),
                  new_block,
                  readme,
                  flags=re.DOTALL,
              )
          else:
              marker = "## 📊 Progress"
              if marker not in readme:
                  raise SystemExit("Could not find the Progress section in README.md")
              readme = readme.replace(
                  marker,
                  marker + "\n\n" + new_block,
                  1,
              )

          with open(readme_path, "w", encoding="utf-8") as f:
              f.write(readme)
          PY

      - name: Commit updated README
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --cached --quiet; then
            echo "README is already up to date."
          else
            git commit -m "docs: update LeetCode progress"
            git push
          fi
